<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract thumbnail illustration for the Clinic Intake and Scheduling Portal" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Clinic Intake &amp; Scheduling Portal</title>
  <defs>
    <linearGradient id="cisp-bg" x1="5%" y1="0%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#FCE7ED" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <filter id="cisp-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28" />
    </filter>
  </defs>

  <!-- background -->
  <rect width="400" height="300" rx="24" fill="url(#cisp-bg)" />

  <!-- soft ambient glow -->
  <circle cx="70" cy="250" r="75" fill="#F06A91" opacity="0.25" filter="url(#cisp-glow)" />

  <!-- schedule grid: 3 columns x 2 rows of rounded "day" cells -->
  <g>
    <!-- row 1 -->
    <rect x="70"  y="68"  width="70" height="56" rx="10" fill="none" stroke="#E9DADC" stroke-width="1.5" />
    <rect x="158" y="68"  width="70" height="56" rx="10" fill="#D92D55" opacity="0.9" />
    <rect x="246" y="68"  width="70" height="56" rx="10" fill="none" stroke="#E9DADC" stroke-width="1.5" />

    <!-- row 2 -->
    <rect x="70"  y="140" width="70" height="56" rx="10" fill="none" stroke="#E9DADC" stroke-width="1.5" />
    <rect x="158" y="140" width="70" height="56" rx="10" fill="none" stroke="#E9DADC" stroke-width="1.5" />
    <rect x="246" y="140" width="70" height="56" rx="10" fill="#F06A91" opacity="0.7" />
  </g>

  <!-- appointment marks inside the booked cells -->
  <circle cx="193" cy="96" r="5" fill="#FFFFFF" />
  <circle cx="281" cy="168" r="5" fill="#FFFFFF" />

  <!-- connecting flow: patient -> staff handoff -->
  <path
    d="M281 196 C 281 224, 320 224, 336 214"
    fill="none"
    stroke="#F06A91"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-dasharray="1 8"
    opacity="0.8"
  />
  <circle cx="344" cy="208" r="8" fill="#FFFFFF" stroke="#F06A91" stroke-width="2.5" />

  <!-- texture: scattered dots -->
  <circle cx="52" cy="60" r="2.5" fill="#6F6265" opacity="0.3" />
  <circle cx="330" cy="70" r="2" fill="#6F6265" opacity="0.3" />
  <circle cx="46" cy="210" r="2" fill="#6F6265" opacity="0.25" />
</svg>
