<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract thumbnail illustration for VITA" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>VITA</title>
  <defs>
    <linearGradient id="vita-bg" x1="5%" y1="0%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#FCE7ED" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <filter id="vita-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26" />
    </filter>
  </defs>

  <!-- background -->
  <rect width="400" height="300" rx="24" fill="url(#vita-bg)" />

  <!-- soft ambient glow -->
  <circle cx="330" cy="60" r="70" fill="#F06A91" opacity="0.28" filter="url(#vita-glow)" />

  <!-- faint baseline -->
  <line x1="40" y1="250" x2="360" y2="250" stroke="#E9DADC" stroke-width="1.5" />

  <!-- texture: scattered dots -->
  <circle cx="66" cy="86" r="2.5" fill="#6F6265" opacity="0.35" />
  <circle cx="96" cy="66" r="2" fill="#6F6265" opacity="0.3" />
  <circle cx="300" cy="220" r="2.5" fill="#6F6265" opacity="0.3" />
  <circle cx="332" cy="200" r="2" fill="#6F6265" opacity="0.25" />

  <!-- ascending path: momentum -->
  <path
    d="M50 214 C 110 214, 120 160, 170 150 C 220 140, 230 96, 300 78 C 330 70, 340 64, 356 54"
    fill="none"
    stroke="#D92D55"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- nodes along the path, growing in size (progress) -->
  <circle cx="50" cy="214" r="7" fill="#FFFFFF" stroke="#D92D55" stroke-width="2.5" />
  <circle cx="170" cy="150" r="9" fill="#D92D55" />
  <circle cx="300" cy="78" r="11" fill="#F06A91" />
  <circle cx="356" cy="54" r="13" fill="#FFFFFF" stroke="#F06A91" stroke-width="3" />

  <!-- small orbiting mark near the final node, a quiet "arrived" flourish -->
  <circle cx="378" cy="40" r="3.5" fill="#D92D55" opacity="0.7" />
</svg>
